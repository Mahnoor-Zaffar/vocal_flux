name: Publish GPU Image

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".dockerignore"
      - "backend/.dockerignore"
      - ".github/workflows/publish-gpu-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Run ruff
        working-directory: backend
        run: uv run ruff check app tests

      - name: Run pytest
        working-directory: backend
        run: uv run pytest -q

  publish-backend-gpu:
    name: Publish backend CUDA image
    needs: backend-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lowercase image owner for GHCR
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_OWNER }}/vocalflux-backend-gpu
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.gpu
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
